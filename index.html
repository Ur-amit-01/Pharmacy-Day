<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>World's Pharmacy Day AMR PPT</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--green:#0f5b47;--deep:#0a3d30;--night:#062a20;--leaf:#2fae7f;--mint:#e4f2ea;--ink:#12251f;--paper:#f4faf6}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--night)}
body.lock{overflow:hidden}
button{font:inherit;cursor:pointer;border:0}
button:focus-visible{outline:3px solid #ffd54a;outline-offset:3px}
svg{display:block;flex:none}

/* ---------- Landing ---------- */
#home{min-height:100dvh;position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 18px 70px;
  background:radial-gradient(900px 600px at 15% 10%,#14775d 0,transparent 60%),radial-gradient(800px 600px at 90% 95%,#0d4d3c 0,transparent 60%),linear-gradient(160deg,var(--deep),var(--night))}
.cap{position:absolute;width:150px;height:56px;border-radius:28px;background:linear-gradient(90deg,#fff 50%,var(--leaf) 50%);opacity:.12}
.card{position:relative;z-index:1;width:min(640px,100%);background:#fff;border-radius:28px;padding:clamp(28px,6vw,52px);text-align:center;box-shadow:0 30px 80px rgba(0,0,0,.4)}
.logo{width:76px;height:76px;margin:0 auto 22px;border-radius:22px;background:linear-gradient(145deg,var(--green),var(--leaf));display:grid;place-items:center;box-shadow:0 10px 24px rgba(15,91,71,.4)}
.pill{display:inline-block;padding:7px 16px;border-radius:99px;background:var(--mint);color:var(--green);font-weight:700;font-size:.95rem}
h1{margin:18px 0 12px;font-size:clamp(2rem,7vw,3.3rem);line-height:1.05;font-weight:800;color:var(--deep);letter-spacing:-.02em}
.sub{margin:0 auto 32px;max-width:440px;font-size:clamp(1rem,2.6vw,1.15rem);line-height:1.5;color:#46655a}
.cta{display:inline-flex;align-items:center;gap:12px;min-height:64px;padding:0 38px;border-radius:99px;background:linear-gradient(135deg,var(--green),#13805f);color:#fff;font-weight:700;font-size:1.25rem;box-shadow:0 12px 28px rgba(15,91,71,.45);transition:transform .15s,box-shadow .15s}
.cta:hover{transform:translateY(-2px);box-shadow:0 16px 34px rgba(15,91,71,.55)}
.credit{position:absolute;bottom:20px;left:0;right:0;text-align:center;color:#a9d3c3;font-size:1rem;z-index:1}
.credit b{color:#fff}

/* ---------- Viewer ---------- */
#viewer{height:100dvh;display:flex;flex-direction:column;background:var(--paper);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.top{display:flex;align-items:center;gap:14px;padding:12px 18px;background:var(--deep);color:#fff}
.top h2{margin:0;flex:1;font-size:clamp(1.05rem,3vw,1.4rem);font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.home-btn{min-height:48px;padding:0 20px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:1rem;display:flex;align-items:center;gap:8px}
.home-btn:hover{background:rgba(255,255,255,.25)}
#viewer main{flex:1;min-height:0;display:flex;padding:14px}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;background:var(--mint);border-radius:20px;overflow:hidden;box-shadow:0 8px 30px rgba(10,61,48,.15)}
.view{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:12px;cursor:zoom-in;touch-action:pan-y;position:relative}
canvas{background:#fff;border-radius:6px;box-shadow:0 4px 22px rgba(10,61,48,.3)}
.msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--deep);font-size:1.1rem}
.bar{display:flex;gap:10px;align-items:center;justify-content:center;padding:10px;background:var(--green)}
.nb{display:flex;align-items:center;justify-content:center;gap:8px;min-height:44px;min-width:0;padding:0 16px;border-radius:12px;background:#fff;color:var(--deep);font-weight:700;font-size:1rem;transition:background .15s,transform .1s}
.nb:hover:not(:disabled){background:var(--mint)}
.nb:active:not(:disabled){transform:scale(.97)}
.nb:disabled{opacity:.4;cursor:default}
.count{color:#fff;font-weight:700;font-size:1rem;min-width:72px;text-align:center}
#exit,#start{min-height:44px}
#exit{display:none;background:#c62828;color:#fff}
#exit:hover{background:#a61f1f!important}
#start{background:#ffd54a;color:#3b2e00}
#start:hover{background:#ffe07a!important}
.foot{text-align:center;padding:2px 0 12px;color:#46655a;font-size:.95rem}

/* ---------- Full screen (real or fallback) ---------- */
.stage.is-fs{position:fixed;inset:0;z-index:99;border-radius:0;box-shadow:none;background:#000}
.is-fs .view{cursor:default;padding:0}
.is-fs canvas{border-radius:0;box-shadow:none}
.is-fs .msg{color:#fff}
.is-fs .bar{position:absolute;inset:0;background:none;padding:0;pointer-events:none}
.is-fs .bar>*{pointer-events:auto;position:absolute}
.is-fs .nb{min-width:0;width:48px;height:48px;min-height:48px;padding:0;border-radius:50%;top:50%;margin-top:-24px;background:rgba(6,42,32,.72);color:#fff;border:2px solid rgba(255,255,255,.55);backdrop-filter:blur(6px)}
.is-fs .nb:hover:not(:disabled){background:rgba(15,91,71,.95)}
.is-fs .nb .lbl,.is-fs #start{display:none}
.is-fs #prev{left:max(16px,env(safe-area-inset-left))}
.is-fs #next{right:max(16px,env(safe-area-inset-right))}
.is-fs #exit{display:flex;top:max(16px,env(safe-area-inset-top));right:max(16px,env(safe-area-inset-right));width:auto;height:44px;min-height:44px;padding:0 18px;border-radius:99px;margin:0;border:2px solid rgba(255,255,255,.7);font-size:1rem}
.is-fs .count{bottom:max(18px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:99px;background:rgba(6,42,32,.75);min-width:0;font-size:.95rem;white-space:nowrap}

@media(max-width:600px){
  #viewer main{padding:8px}
  .top{padding:10px 12px}
  .bar{flex-wrap:wrap;padding:10px}
  .count{order:-1;flex-basis:100%}
  .nb{flex:1;min-width:0;padding:0 12px;min-height:44px}
  #start{flex-basis:100%}
  .is-fs .nb{width:44px;height:44px;min-height:44px;margin-top:-22px;flex:none}
  .is-fs #exit{height:42px;min-height:42px;padding:0 16px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- Landing -->
<section id="home">
  <span class="cap" style="top:8%;left:6%;transform:rotate(-28deg)"></span>
  <span class="cap" style="top:18%;right:5%;transform:rotate(35deg);width:110px;height:42px"></span>
  <span class="cap" style="bottom:14%;left:9%;transform:rotate(22deg);width:120px;height:46px"></span>
  <span class="cap" style="bottom:20%;right:8%;transform:rotate(-40deg);width:170px;height:62px"></span>

  <div class="card">
    <div class="logo" aria-hidden="true">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5a5 5 0 0 1-7-7l7-7a5 5 0 0 1 7 7z"/><path d="m8.5 8.5 7 7"/></svg>
    </div>
    <span class="pill">Antimicrobial Resistance</span>
    <h1>World's Pharmacy Day AMR PPT</h1>
    <p class="sub">A slideshow on antimicrobial resistance, presented for World Pharmacy Day.</p>
    <button class="cta" id="open">
      Open PPT
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>
  </div>
  <p class="credit">Developed by <b>Amit</b></p>
</section>

<!-- Viewer -->
<section id="viewer" hidden>
  <div class="top">
    <button class="home-btn" id="home-btn" aria-label="Back to home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>Home
    </button>
    <h2>World's Pharmacy Day AMR PPT</h2>
  </div>
  <main>
    <div class="stage" id="stage">
      <div class="view" id="view" title="Start slideshow">
        <canvas id="cv" aria-label="Slide"></canvas>
        <div class="msg" id="msg">Loading slides…</div>
      </div>
      <div class="bar">
        <button class="nb" id="prev" aria-label="Previous slide">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg><span class="lbl">Previous</span>
        </button>
        <span class="count" id="count">– / –</span>
        <button class="nb" id="next" aria-label="Next slide">
          <span class="lbl">Next</span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
        <button class="nb" id="start" aria-label="Start full screen slideshow">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span class="lbl">Full screen</span>
        </button>
        <button class="nb" id="exit" aria-label="Exit full screen">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>Exit
        </button>
      </div>
    </div>
  </main>
  <p class="foot">Developed by Amit</p>
</section>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
// >>> Change this to your PDF's file name (same folder as index.html) <<<
const PDF_URL = "pharmacy-day.pdf";

pdfjsLib.GlobalWorkerOptions.workerSrc =
  "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const $ = id => document.getElementById(id);
const stage = $("stage"), view = $("view"), cv = $("cv"), msg = $("msg");
let pdf = null, num = 1, busy = false, again = false, loading = false;

const isFs = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
const inFs = () => stage.classList.contains("is-fs");

async function render() {
  if (!pdf) return;
  if (busy) { again = true; return; }
  busy = true;
  try {
    const page = await pdf.getPage(num);
    const base = page.getViewport({ scale: 1 });
    const pad = inFs() ? 0 : 24;
    const fit = Math.min((view.clientWidth - pad) / base.width, (view.clientHeight - pad) / base.height);
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const vp = page.getViewport({ scale: fit * dpr });
    const off = document.createElement("canvas");
    off.width = vp.width; off.height = vp.height;
    await page.render({ canvasContext: off.getContext("2d"), viewport: vp }).promise;
    cv.width = off.width; cv.height = off.height;
    cv.style.width = vp.width / dpr + "px";
    cv.style.height = vp.height / dpr + "px";
    cv.getContext("2d").drawImage(off, 0, 0);
  } catch (e) { console.error(e); }
  busy = false;
  if (again) { again = false; render(); }
}

function sync() {
  $("count").textContent = num + " / " + pdf.numPages;
  $("prev").disabled = num <= 1;
  $("next").disabled = num >= pdf.numPages;
}

function go(d) {
  if (!pdf) return;
  const n = Math.min(pdf.numPages, Math.max(1, num + d));
  if (n === num) return;
  num = n; sync(); render();
}

async function enterFs() {
  if (inFs() || !pdf) return;
  try {
    if (stage.requestFullscreen) await stage.requestFullscreen();
    else if (stage.webkitRequestFullscreen) stage.webkitRequestFullscreen();
    else throw new Error("no fullscreen api");
  } catch (e) {
    // Fallback (e.g. iPhone Safari): cover the whole page instead
    stage.classList.add("is-fs");
    document.body.classList.add("lock");
    setTimeout(render, 80);
  }
}

function exitFs() {
  if (isFs()) (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  else { stage.classList.remove("is-fs"); document.body.classList.remove("lock"); setTimeout(render, 80); }
}

function onFsChange() {
  stage.classList.toggle("is-fs", isFs());
  setTimeout(render, 120);
}
document.addEventListener("fullscreenchange", onFsChange);
document.addEventListener("webkitfullscreenchange", onFsChange);

function loadPdf() {
  if (pdf || loading) return;
  loading = true;
  pdfjsLib.getDocument(PDF_URL).promise.then(doc => {
    pdf = doc; msg.remove(); sync(); render();
  }).catch(err => {
    console.error(err); loading = false;
    msg.textContent = "Couldn't load \"" + PDF_URL + "\". Check the file name, and open this page through your GitHub Pages link (not as a local file).";
  });
}

$("open").onclick = () => {
  $("home").hidden = true; $("viewer").hidden = false;
  loadPdf(); render();
};
$("home-btn").onclick = () => { $("viewer").hidden = true; $("home").hidden = false; };

$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("start").onclick = enterFs;
$("exit").onclick = exitFs;
view.addEventListener("click", () => { if (!inFs()) enterFs(); });

let sx = null;
view.addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
view.addEventListener("touchend", e => {
  if (sx === null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
}, { passive: true });

document.addEventListener("keydown", e => {
  if ($("viewer").hidden) return;
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); go(1); }
  else if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); go(-1); }
  else if (e.key === "Escape" && inFs()) exitFs();
  else if (e.key.toLowerCase() === "f") enterFs();
});

let t;
window.addEventListener("resize", () => { clearTimeout(t); t = setTimeout(render, 150); });
</script>
</body>
</html>
